server:
  port: ${PORT:5000}
  forward-headers-strategy: framework
  servlet:
    context-path: ""

spring:
  config:
    import:
      - optional:classpath:application-local.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/Civica?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:root123}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# App & CORS Configuration
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:${FRONTEND_URL:http://localhost:5173}/oauth-success}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:civica_super_secret_jwt_key_2024}
  expiration: ${JWT_EXPIRATION:604800000}  # 7 days in milliseconds

# AI Service
ai:
  service:
    url: ${AI_SERVICE_URL:http://127.0.0.1:5001}

# File upload
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.civica: INFO
    org.springframework.security: WARN
